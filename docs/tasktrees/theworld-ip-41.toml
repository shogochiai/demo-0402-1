version = "1.0"
id = "theworld-ip-41"
title = "Add cancelProposal to td"
owner = "etherclaw"
created_at = "2026-04-01"

# SPEC
# Sections 1-5 high-level requirements:
# REQ_CANCEL_001: A proposal author can cancel their own proposal before voting finalization ends to remove stale proposals from the active governance flow.
# REQ_CANCEL_002: Cancellation is authorized only for the original proposal author and must reject non-authors and proposals already finalized.
# REQ_CANCEL_003: A successful cancellation moves the proposal into a terminal cancelled state and records an audit event.
# Sections 6-11 detailed specs:
# REQ_CANCEL_004: Cancelled proposals are excluded from tally processing, active proposal listings, and voting-slot accounting.
# REQ_CANCEL_005: TheWorld exposes cancelIpProposal(text) -> (text) with JSON input carrying ipId, implemented with ERC-7546-compatible selector dispatch and storage-free implementation logic.
# REQ_CANCEL_006: The CLI adds etherclaw ip cancel <ipId> to invoke cancelIpProposal and report the cancelled result to the operator.

[[codebase_ref]]
path = "vendor/idris2-evm/examples/selector-dispatch.idr"
comment = "Use idris2-evm Yul codegen patterns for selector routing, ABI-safe argument decoding, and call result encoding without Solidity."

[[codebase_ref]]
path = "vendor/idris2-subcontract/src/ERC7546/UpgradeableClone.idr"
comment = "Use ERC-7546 upgradeable clone types and selector mapping; keep implementation logic pure and storage-free behind getImplementation(bytes4)."

[[codebase_ref]]
path = "pkgs/Idris2TextDao/src/TextDAO/Functions/Propose/Propose.idr"
comment = "Mirror proposal lifecycle storage access and proposal author lookup from the existing propose flow."

[[codebase_ref]]
path = "pkgs/Idris2TextDao/src/TextDAO/Functions/Vote/Vote.idr"
comment = "Reuse voting-window and proposal-state gating patterns so cancelProposal respects the existing governance lifecycle."

[[codebase_ref]]
path = "pkgs/Idris2TextDao/src/TextDAO/Functions/Tally/Tally.idr"
comment = "Update tally behavior so cancelled proposals are skipped during due tally execution and no longer consume active governance bandwidth."

